name: Ansible syntax
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible Core
        run: python -m pip install 'ansible-core>=2.17,<2.21'
      - name: Check Stage 6 playbook syntax
        run: ansible-playbook --syntax-check -i inventory/inventory.example.yml playbooks/stage6_lite_prepare.yml
